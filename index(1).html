<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;
  background:#0868f5;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 10px;
}
.container{width:min(100%,620px);min-height:760px;display:flex;align-items:center}
.card{
  width:100%;
  background:#fff;
  border-radius:38px;
  padding:38px 22px 35px;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
}
.profile{
  width:116px;height:116px;border-radius:50%;
  margin:0 auto 24px;
  border:5px solid #18c96b;
  background:linear-gradient(135deg,#ddd,#777);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:43px;
}
.online{
  color:#18bd62;
  font-size:24px;
  font-weight:700;
  margin-bottom:43px;
}
.online:before{
  content:"";
  display:inline-block;
  width:18px;height:18px;
  border-radius:50%;
  background:#18c96b;
  margin-right:9px;
  vertical-align:2px;
}
.connecting{
  color:#10bd68;
  font-size:25px;
  font-weight:700;
  margin-bottom:30px;
}
.instruction{
  color:#30485d;
  font-size:19px;
  font-weight:800;
  margin-bottom:24px;
}
.chat-button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:76px;
  border-radius:42px;
  background:#14d15c;
  color:#fff;
  text-decoration:none;
  font-size:22px;
  font-weight:800;
  box-shadow:0 6px 14px rgba(0,0,0,.12);
  transition:transform .12s ease;
}
.chat-button:active{transform:scale(.985)}
.whatsapp-icon{
  width:42px;height:42px;
  border:3px solid #fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}
@media(max-width:480px){
  .container{min-height:100vh}
  .card{border-radius:30px;padding:32px 17px 30px}
  .online{font-size:21px;margin-bottom:32px}
  .connecting{font-size:22px}
  .instruction{font-size:17px}
  .chat-button{font-size:19px;min-height:68px}
}
</style>
</head>
<body>
<div class="container">
  <section class="card">
    <div class="profile">♥</div>
    <div class="online">Online now</div>
    <div class="connecting">💬 Connecting to WhatsApp...</div>
    <div class="instruction">👇 CLICK BELOW TO CONTINUE 👇</div>

    <a class="chat-button"
       href="https://guyprior.com/qrzyd21q?key=1505c17ef1047108c495cb4c21e6e6a8"
       target="_blank"
       rel="noopener noreferrer">
      <span class="whatsapp-icon">☎</span>
      CLICK TO CHAT ON WHATSAPP
    </a>
  </section>
</div>
</body>
</html>
